name: Release

on:
  push:
    branches: [main]

# Avoid two releases racing if commits land close together.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags/releases and push the changelog + version bump
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs
  id-token: write # npm provenance (trusted publishing)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false # let semantic-release use GITHUB_TOKEN for the push

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release
