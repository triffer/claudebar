name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  shellcheck:
    name: Lint shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -x --severity=warning \
            install.sh hooks/*.sh hooks/claudebar-lib/*.sh host/*.sh examples/*.sh

  test:
    name: Shell tests (bash 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run bats suite
        run: npm test

  test-macos:
    name: Shell tests (macOS, bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Put system bash ahead of Homebrew bash on PATH
        run: echo "/bin" >> "$GITHUB_PATH"

      - name: Fail unless /bin/bash is still 3.2
        run: |
          bash --version | head -1
          case "$(bash -c 'echo $BASH_VERSION')" in
            3.2*) ;;
            *) echo "expected bash 3.2 from /bin/bash — this job no longer tests what it claims" >&2
               exit 1 ;;
          esac

      - name: Ensure jq
        run: command -v jq >/dev/null || brew install jq

      - name: Run bats suite
        run: npm test

      - name: Check every script parses under bash 3.2
        run: |
          for f in install.sh hooks/*.sh hooks/claudebar-lib/*.sh host/*.sh examples/*.sh; do
            /bin/bash -n "$f" || exit 1
          done
